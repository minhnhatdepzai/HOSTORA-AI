<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOSTORA · phim mở đầu</title>
    <style>
      @font-face {
        font-family: BeVietnam;
        src: url("../node_modules/@expo-google-fonts/be-vietnam-pro/800ExtraBold/BeVietnamPro_800ExtraBold.ttf");
        font-weight: 800;
      }
      @font-face {
        font-family: BeVietnam;
        src: url("../node_modules/@expo-google-fonts/be-vietnam-pro/400Regular/BeVietnamPro_400Regular.ttf");
        font-weight: 400;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: BeVietnam, sans-serif; background: #071827; }
      .film {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        color: #f7faf8;
        background: radial-gradient(ellipse 68% 35% at 50% 43%, #194a49 0%, #0a2631 52%, #071827 100%);
      }
      .film::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: .25;
        background-image: linear-gradient(#b5efd20a 1px, transparent 1px), linear-gradient(90deg, #b5efd20a 1px, transparent 1px);
        background-size: 90px 90px;
      }
      .film::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 85% 73% at 50% 45%, transparent 38%, #071827d9 100%);
      }
      .topline { position: absolute; top: 7.3%; left: 8%; right: 8%; height: 1px; background: #b5efd26b; transform: scaleX(0); transform-origin: left; }
      .topword { position: absolute; top: 9%; left: 8%; color: #b5efd2; font: 400 17px BeVietnam; letter-spacing: .2em; opacity: 0; }
      .index { position: absolute; top: 9%; right: 8%; color: #93bcb8; font: 400 17px BeVietnam; letter-spacing: .2em; opacity: 0; }
      .orbit { position: absolute; top: 23%; left: 50%; width: 560px; height: 560px; margin-left: -280px; border: 1px solid #b5efd246; border-radius: 50%; opacity: 0; }
      .orbit::after { content: ""; position: absolute; inset: 45px; border: 1px dashed #b5efd242; border-radius: 50%; }
      .orbit-two { width: 720px; height: 720px; margin-left: -360px; top: 18%; border-color: #b5efd21a; }
      .orbit-two::after { display: none; }
      .cross { position: absolute; top: 41%; left: 50%; width: 86%; height: 1px; margin-left: -43%; background: linear-gradient(90deg, transparent, #b5efd290 50%, transparent); opacity: 0; transform: scaleX(.3); }
      .beam { position: absolute; top: 29%; left: -40%; width: 55%; height: 45%; transform: skewX(-25deg); opacity: 0; background: linear-gradient(90deg, transparent, #b5efd207, #72d8c714, transparent); }
      .logo-halo { position: absolute; left: 50%; top: 40%; width: 390px; height: 390px; margin: -195px; border-radius: 78px; opacity: 0; box-shadow: 0 0 110px 25px #6ef5c540; }
      .logo {
        position: absolute;
        left: 50%; top: 40%;
        width: 280px; height: 280px;
        margin: -140px;
        border-radius: 59px;
        object-fit: cover;
        opacity: 0;
        filter: blur(22px);
        transform: scale(.72);
        box-shadow: 0 35px 100px #0009, 0 0 0 1px #b5efd235;
      }
      .locator { position: absolute; left: 50%; top: 40%; width: 420px; height: 420px; margin: -210px; border: 1px solid #b5efd23b; border-radius: 50%; opacity: 0; }
      .locator::before, .locator::after { content: ""; position: absolute; width: 42px; height: 2px; background: #b5efd2; top: 50%; }
      .locator::before { left: -21px; } .locator::after { right: -21px; }
      .copy { position: absolute; top: 62%; left: 8%; right: 8%; text-align: center; }
      .eyebrow { color: #b5efd2; font: 400 19px BeVietnam; letter-spacing: .17em; opacity: 0; }
      .headline { margin-top: 29px; font: 800 61px/1.28 BeVietnam; letter-spacing: -.045em; opacity: 0; transform: translateY(50px); }
      .headline span { color: #b5efd2; }
      .brand { margin-top: 34px; color: #fff; font: 800 44px BeVietnam; letter-spacing: -.045em; opacity: 0; transform: translateY(32px); }
      .brand span { color: #b5efd2; }
      .foot { position: absolute; left: 8%; right: 8%; bottom: 9%; display: flex; align-items: center; justify-content: space-between; color: #9cb8b7; font: 400 16px BeVietnam; letter-spacing: .08em; opacity: 0; }
      .progress { position: absolute; left: 8%; right: 8%; bottom: 6.8%; height: 2px; background: #b5efd22c; }
      .progress::after { content: ""; display: block; width: 100%; height: 100%; background: #b5efd2; transform: scaleX(0); transform-origin: left; }
      .play .topline { animation: line 1.15s .15s cubic-bezier(.19,1,.22,1) both; }
      .play .topword, .play .index { animation: appear .7s .45s both; }
      .play .orbit { animation: orbit 5.4s .3s ease-out both; }
      .play .orbit-two { animation: orbit 5.4s .5s ease-out both reverse; }
      .play .cross { animation: cross 1.4s .48s ease-out both; }
      .play .beam { animation: beam 3.2s .6s ease-out both; }
      .play .logo-halo { animation: halo 3.8s .8s ease-out both; }
      .play .logo { animation: logo 2s .85s cubic-bezier(.2,.75,.1,1) both, breathe 3.5s 2.85s ease-in-out infinite alternate; }
      .play .locator { animation: locator 1.7s 1.15s ease-out both; }
      .play .eyebrow { animation: appear .9s 1.8s both; }
      .play .headline { animation: rise 1s 2.25s cubic-bezier(.2,.8,.2,1) both; }
      .play .brand { animation: rise .9s 3.3s cubic-bezier(.2,.8,.2,1) both; }
      .play .foot { animation: appear .8s 4s both; }
      .play .progress::after { animation: line 5.6s .2s linear both; }
      @keyframes line { to { transform: scaleX(1); } }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes orbit { 0% { opacity: 0; transform: rotate(-35deg) scale(.78); } 30% { opacity: .9; } 100% { opacity: .22; transform: rotate(34deg) scale(1.08); } }
      @keyframes cross { 0% { opacity: 0; transform: scaleX(.3); } 35% { opacity: 1; } 100% { opacity: .18; transform: scaleX(1); } }
      @keyframes beam { 0% { opacity: 0; transform: translateX(-70%) skewX(-25deg); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(280%) skewX(-25deg); } }
      @keyframes halo { 0% { opacity: 0; transform: scale(.55); } 35% { opacity: 1; } 100% { opacity: .32; transform: scale(1.27); } }
      @keyframes logo { 0% { opacity: 0; filter: blur(22px); transform: scale(.72); } 55% { opacity: 1; filter: blur(0); transform: scale(1.035); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }
      @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.035); } }
      @keyframes locator { 0% { opacity: 0; transform: scale(.5) rotate(-28deg); } 45% { opacity: 1; } 100% { opacity: .28; transform: scale(1.1) rotate(0); } }
      @keyframes rise { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <main class="film" aria-label="Phim mở đầu HOSTORA">
      <div class="topline"></div><div class="topword">HOSTORA / MỞ ĐẦU</div><div class="index">01 / 01</div>
      <div class="orbit"></div><div class="orbit orbit-two"></div><div class="cross"></div><div class="beam"></div>
      <div class="logo-halo"></div><div class="locator"></div>
      <img class="logo" src="../assets/images/hostora-icon-source.png" alt="Logo HOSTORA" />
      <div class="copy">
        <div class="eyebrow">MỞ TRANG WEB VỚI KẾ HOẠCH RÕ RÀNG</div>
        <div class="headline">Chọn đúng.<br /><span>Hiểu rõ chi phí.</span></div>
        <div class="brand">HOSTORA <span>AI</span></div>
      </div>
      <div class="foot"><span>TÊN MIỀN · LƯU TRỮ · CHI PHÍ</span><span>HOSTORA / 2026</span></div>
      <div class="progress"></div>
    </main>
    <script>
      window.playIntro = () => document.documentElement.classList.add("play");
    </script>
  </body>
</html>
