name: hostora-ai

services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${HOSTORA_MAILPIT_PORT:-8025}:8025"

  ollama:
    image: ollama/ollama:0.34.1
    restart: unless-stopped
    ports:
      - "${HOSTORA_PORT:-3000}:3000"
      - "127.0.0.1:${HOSTORA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  model-init:
    image: ollama/ollama:0.34.1
    network_mode: "service:ollama"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      CHAT_MODEL: ${HOSTORA_CHAT_MODEL:-qwen3.5:9b-q8_0}
      EMBED_MODEL: ${HOSTORA_EMBED_MODEL:-qwen3-embedding:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama pull "$$CHAT_MODEL"
        ollama pull "$$EMBED_MODEL"
    restart: "no"

  web:
    image: hostora-ai-web:local
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "service:ollama"
    depends_on:
      model-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_CHAT_MODEL: ${HOSTORA_CHAT_MODEL:-qwen3.5:9b-q8_0}
      OLLAMA_CHATBOT_MODEL: ${HOSTORA_CHATBOT_MODEL:-qwen3.5:9b-q8_0}
      OLLAMA_EMBED_MODEL: ${HOSTORA_EMBED_MODEL:-qwen3-embedding:4b}
      OLLAMA_CONTEXT_LENGTH: ${HOSTORA_CONTEXT_LENGTH:-16384}
      OLLAMA_TIMEOUT_MS: ${HOSTORA_TIMEOUT_MS:-90000}
      HOSTORA_MAX_AI_CONCURRENCY: ${HOSTORA_MAX_AI_CONCURRENCY:-1}
      HOSTORA_BUILD_RAG_INDEX: ${HOSTORA_BUILD_RAG_INDEX:-1}
      RAG_INDEX_PATH: /app/data/runtime/rag-index.json
      HOSTORA_PAYMENTS_DB_PATH: /app/data/runtime/payments.sqlite
      HOSTORA_CATALOG_DB_PATH: /app/data/runtime/catalog.sqlite
      HOSTORA_PAYMENTS_MODE: demo
      HOSTORA_PUBLIC_BASE_URL: ${HOSTORA_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      HOSTORA_ADMIN_SESSION_SECRET: ${HOSTORA_ADMIN_SESSION_SECRET:?Set HOSTORA_ADMIN_SESSION_SECRET in .env.docker}
      HOSTORA_SMTP_HOST: mailpit
      HOSTORA_SMTP_PORT: "1025"
      HOSTORA_SMTP_SECURE: "false"
      HOSTORA_SMTP_USER: hostora
      HOSTORA_SMTP_PASSWORD: local-mailpit-only
      HOSTORA_EMAIL_FROM: HOSTORA Local <no-reply@hostora.local>
      HOSTORA_ORDER_NOTIFICATION_EMAIL: admin@hostora.local
      HOSTORA_RELEASE_BASE_URL: ${HOSTORA_RELEASE_BASE_URL:-https://github.com/minhnhatdepzai/HOSTORA-AI/releases/latest/download}
    volumes:
      - runtime_data:/app/data/runtime
    init: true
    restart: unless-stopped

volumes:
  ollama_data:
  runtime_data:
